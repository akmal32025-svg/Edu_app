name: edu_app
description: تطبيق تعليمي احترافي لنشر الكورسات والدروس التعليمية
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  file_picker: ^8.0.0
  video_player: ^2.8.6
  chewie: ^1.8.1
  image_picker: ^1.1.2
  open_file: ^3.3.2
  path_provider: ^2.1.3

  provider: ^6.1.2

  shared_preferences: ^2.2.3
  sqflite: ^2.3.3

  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  path: ^1.9.0
  mime: ^1.0.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
