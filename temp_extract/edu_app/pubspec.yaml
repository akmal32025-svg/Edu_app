name: edu_app
description: تطبيق تعليمي لنشر الفيديوهات والملفات
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  
  # File & Media
  file_picker: ^6.1.1
  video_player: ^2.8.1
  chewie: ^1.7.4
  image_picker: ^1.0.7
  open_file: ^3.3.2
  path_provider: ^2.1.2
  
  # State Management
  provider: ^6.1.1
  
  # Storage & Database
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  
  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  url_launcher: ^6.2.4
  path: ^1.9.0
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
